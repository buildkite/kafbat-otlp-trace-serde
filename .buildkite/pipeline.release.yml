agents:
  queue: hosted

env:
  MISE_YES: "1"
  MISE_TRUSTED_CONFIG_PATHS: /buildkite/builds

steps:
  - label: ":package: Publish JAR"
    plugins:
      - mise#v1.1.2: ~
    commands:
      - mise run check
      - version="$$(./gradlew --no-daemon properties -q | awk '$$1 == "version:" { print $$2 }')"
      - test "$$BUILDKITE_TAG" = "v$$version"
      - jar="build/libs/kafbat-otlp-trace-serde-$$version.jar"
      - test -f "$$jar"
      - token="$$(buildkite-agent oidc request-token --audience "https://packages.buildkite.com/buildkite/kafbat-otlp-trace-serde" --lifetime 300)"
      - 'curl --fail --show-error --silent --request POST "https://api.buildkite.com/v2/packages/organizations/buildkite/registries/kafbat-otlp-trace-serde/packages" --header "Authorization: Bearer $$token" --form "file=@$$jar"'
