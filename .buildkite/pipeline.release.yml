agents:
  queue: hosted

env:
  MISE_YES: "1"
  MISE_TRUSTED_CONFIG_PATHS: /buildkite/builds

steps:
  - label: ":docker: Publish artifact image"
    plugins:
      - mise#v1.1.2: ~
    commands:
      - mise run check
      - version="$$(./gradlew --no-daemon properties -q | awk '$$1 == "version:" { print $$2 }')"
      - test "$$BUILDKITE_TAG" = "v$$version"
      - image="packages.buildkite.com/buildkite/kafbat-otlp-trace-serde/kafbat-otlp-trace-serde:$$version"
      - buildkite-agent oidc request-token --audience "https://packages.buildkite.com/buildkite/kafbat-otlp-trace-serde" --lifetime 300 | docker login packages.buildkite.com/buildkite/kafbat-otlp-trace-serde --username buildkite --password-stdin
      - docker build --platform linux/amd64 --tag "$$image-amd64" .
      - docker push "$$image-amd64"
      - docker build --platform linux/arm64 --tag "$$image-arm64" .
      - docker push "$$image-arm64"
      - docker manifest create "$$image" "$$image-amd64" "$$image-arm64"
      - docker manifest push "$$image"
