plugins {
    id 'java'
}

group = 'com.buildkite.kafbat'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'io.kafbat.ui:serde-api:1.1.0'

    implementation 'io.opentelemetry.proto:opentelemetry-proto:1.11.0-alpha'
    implementation 'com.google.protobuf:protobuf-java-util:4.35.1'

    testImplementation('io.kafbat.ui:serde-api:1.1.0') {
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    exclude 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.SF'
}

tasks.named('test') {
    useJUnitPlatform()
}
